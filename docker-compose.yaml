version: "3.9"

services:
  caddy:
    image: caddy
    container_name: caddy-handout
    volumes:
      - handout:/handout
    command:
      [
        "caddy",
        "file-server",
        "--root",
        "/handout",
        "--listen",
        ":8080",
        "--browse",
      ]
    ports:
      - "4000:8080"
    restart: unless-stopped

  jumping_jacks:
    build: ./binary-exploitation/jumping-jacks
    container_name: jumping-jacks
    volumes:
      - handout:/handout
    ports:
      - "4001:4444"
    restart: unless-stopped

volumes:
  handout:
